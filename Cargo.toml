[package]
name = "takeovermydeskop"
version = "0.1.0"
edition = "2024"
description = "Lets Claude use your desktop on Windows and Linux: an MCP server with screenshots and real mouse and keyboard input"
license = "MIT"
repository = "https://github.com/rafaelSomerBarbosa/takeovermydeskop"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.6", features = ["event", "fs"] }
wayland-client = "0.31.15"
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
x11rb = { version = "0.14.0", features = ["randr", "xfixes", "xtest"] }

# Image resizing and JPEG encoding are painfully slow unoptimized.
[profile.dev.package."*"]
opt-level = 3
