name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # Link the C runtime statically so the .exe runs without the Visual C++ redistributable.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: grep -qx "version = \"${GITHUB_REF_NAME#v}\"" Cargo.toml || { echo "Tag $GITHUB_REF_NAME doesn't match the version in Cargo.toml"; exit 1; }

      - name: Update Rust
        run: rustup update stable --no-self-update && rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - uses: actions/upload-artifact@v7
        with:
          name: takeovermydeskop
          path: target/release/takeovermydeskop.exe

      # Pushing a tag like v0.1.0 publishes the .exe, and a zip of it with the README and license,
      # on that tag's GitHub release.
      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: Compress-Archive -Path target/release/takeovermydeskop.exe, README.md, LICENSE -DestinationPath "takeovermydeskop-$env:GITHUB_REF_NAME-windows-x64.zip"

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" target/release/takeovermydeskop.exe "takeovermydeskop-$GITHUB_REF_NAME-windows-x64.zip" --clobber
